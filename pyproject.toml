[project]
name = "blent-ai-home-insurance-claims-agent"
version = "0.1.0"
description = "Multi-agent AI pipeline for home insurance claims (AssurHabitat)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "accelerate>=0.30.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "torchvision>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Force CUDA 12.4 torch on Linux (sandbox GPU, driver CUDA 12.5).
# Mac falls back to default PyPI wheels (MPS build).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
