[project]
name = "blent-ai-home-insurance-claims-agent"
version = "0.1.0"
description = "Multi-agent AI pipeline for home insurance claims (AssurHabitat)"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "accelerate>=0.30.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "torchvision>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
